  現在的我躺在床上
  <br/>
  很久沒有做自己曾經喜歡的事情
  <br/>
  我以為長大後自己能夠承受更多的苦難，但原來我面對痛苦時仍然忘記不了，就像永遠的創傷把我打倒
  <br/>
  我坐在電腦前什麼都不做的時間越來越長
  <br/>
  洗澡和家務也只是盡最後的力氣
  <br/>

  <br/>
